name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Binários do PostgreSQL de teste, vet e testes
        run: make test

      - name: Lint, govulncheck e arquivos gerados
        run: make lint

      - name: Build do painel
        run: npm --prefix web run build
