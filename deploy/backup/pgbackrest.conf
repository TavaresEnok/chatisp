# Parte estática. A cifra do repositório e a retenção entram por variáveis de ambiente
# (PGBACKREST_REPO1_CIPHER_PASS, PGBACKREST_REPO1_RETENTION_FULL) definidas no
# compose.backup.yaml a partir do .env: sem valor, o Compose recusa a subida.
[global]
repo1-path=/backup/repo
repo1-type=posix
repo1-cipher-type=aes-256-cbc
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail
compress-type=zst
start-fast=y

[chatisp]
pg1-user=chatisp
pg1-path=/var/lib/postgresql/18/docker
