name: chatisp

x-chatisp-image: &chatisp-image
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: runtime
  image: chatisp:local
  environment: &chatisp-env
    CHATISP_ENV: development
    CHATISP_DATABASE_URL: postgres://chatisp_owner:${CHATISP_OWNER_PASSWORD:?defina CHATISP_OWNER_PASSWORD}@postgres:5432/chatisp?sslmode=disable
    CHATISP_APP_DATABASE_URL: postgres://chatisp_app:${CHATISP_APP_PASSWORD:?defina CHATISP_APP_PASSWORD}@postgres:5432/chatisp?sslmode=disable
    CHATISP_PLATFORM_DATABASE_URL: postgres://chatisp_platform:${CHATISP_PLATFORM_PASSWORD:?defina CHATISP_PLATFORM_PASSWORD}@postgres:5432/chatisp?sslmode=disable
    CHATISP_MIGRATIONS_DIR: /usr/share/chatisp/migrations
    CHATISP_PANEL_ORIGINS: https://localhost:8443
    CHATISP_HTTP_ADDR: 0.0.0.0:8080
    CHATISP_METRICS_ADDR: 0.0.0.0:9090
    CHATISP_LOG_LEVEL: info
    S3_ENDPOINT: http://garage:3900
    S3_REGION: garage
    S3_BUCKET: chatisp-dev

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: chatisp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: chatisp
      CHATISP_OWNER_PASSWORD: ${CHATISP_OWNER_PASSWORD:?defina CHATISP_OWNER_PASSWORD}
      CHATISP_APP_PASSWORD: ${CHATISP_APP_PASSWORD:?defina CHATISP_APP_PASSWORD}
      CHATISP_PLATFORM_PASSWORD: ${CHATISP_PLATFORM_PASSWORD:?defina CHATISP_PLATFORM_PASSWORD}
      CHATISP_INGRESS_PASSWORD: ${CHATISP_INGRESS_PASSWORD:?defina CHATISP_INGRESS_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init/001-roles.sh:/docker-entrypoint-initdb.d/001-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatisp -d chatisp"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  garage-init:
    image: debian:13-slim
    volumes:
      - garage-config:/etc/garage
      - ./garage/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  garage:
    image: dxflrs/garage:v2.5.0
    depends_on:
      garage-init:
        condition: service_completed_successfully
    entrypoint: ["/garage"]
    command: ["-c", "/etc/garage/garage.toml", "server", "--single-node"]
    volumes:
      - garage-config:/etc/garage
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    restart: unless-stopped

  chatisp-migrate:
    <<: *chatisp-image
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  chatisp-api:
    <<: *chatisp-image
    command: ["api"]
    depends_on:
      chatisp-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  chatisp-worker:
    <<: *chatisp-image
    command: ["worker"]
    depends_on:
      chatisp-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: edge
    image: chatisp-caddy:local
    depends_on:
      chatisp-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  postgres-data:
  garage-config:
  garage-meta:
  garage-data:
  caddy-data:
  caddy-config:
