version: "2"

run:
  timeout: 5m
  modules-download-mode: vendor

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - unused
  exclusions:
    generated: lax
    paths:
      - backend/vendor
      - vendor

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - backend/vendor
      - vendor
